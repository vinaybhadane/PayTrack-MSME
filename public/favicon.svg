<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE485"/>
      <stop offset="50%" stop-color="#FFD758"/>
      <stop offset="100%" stop-color="#F2C842"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Bezel -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="#15121B" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Subtle inner radial ambient glow -->
  <circle cx="64" cy="64" r="44" fill="#FFD758" opacity="0.12"/>

  <!-- Stylized PayTrack 'P' Emblem with MSME Shield Notch -->
  <path d="M42 34 H72 C85.25 34 94 42.5 94 54 C94 65.5 85.25 74 72 74 H58 V94 H42 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <rect x="58" y="47" width="13" height="14" rx="4" fill="#15121B"/>
  
  <!-- Fast Settlement / Active Rupee Notch -->
  <circle cx="86" cy="88" r="10" fill="#0D9488" stroke="#15121B" stroke-width="2.5"/>
  <path d="M83 88 L85.5 90.5 L89.5 85.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
